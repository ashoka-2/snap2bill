


{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>

  <link rel="stylesheet" type="text/css" href="{% static 'admin/adminstyle.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'admin/auth.css' %}">


</head>
<body>

  <div class="glass-card">
    <h1>Forgot Password</h1>
    <p class="subtitle" id="form-subtitle">Enter your registered email to get an OTP.</p>

    <div class="form-container">

      <div id="email-section">
        <div class="input-group">
          <label for="email_input" class="input-label">Email Address</label>
          <input type="email" id="email_input" placeholder="Type your email" required />
        </div>
        <button type="button" id="sendOtpBtn" class="btn-primary" onclick="sendOtp()">Send OTP</button>
      </div>

      <div id="otp-section" class="hidden">
        <div class="input-group">
          <label for="otp_input" class="input-label">Enter OTP</label>
          <input type="text" id="otp_input" placeholder="6-digit code" required />
        </div>
        <button type="button" class="btn-primary" onclick="verifyOtp()">Verify OTP</button>
      </div>

      <form id="final-submit-form" action="/forget_password_post" method="post" class="hidden">
        {% csrf_token %}
        <input type="hidden" name="username" id="final_username" />
      </form>

      <div class="form-footer">
        <a href="/" class="back-link">Back to Login</a>
      </div>
    </div>
  </div>

  <div id="js-toast">Message goes here</div>

  <script>
    let generatedOtp = "";

    function showToast(msg, type) {
        const toast = document.getElementById('js-toast');
        toast.innerText = msg;
        toast.className = "show " + type;
        setTimeout(() => { toast.className = ""; }, 3000);
    }

    // Function 1: Send Email to API
    async function sendOtp() {
        const email = document.getElementById('email_input').value;
        if (!email) {
            showToast("Please enter email!", "error");
            return;
        }

        const btn = document.getElementById('sendOtpBtn');
        btn.innerText = "Sending...";
        btn.disabled = true;

        try {
            // Hitting your existing Flutter API endpoint
            let formData = new FormData();
            formData.append('email', email);

            const response = await fetch('/forgotemail', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'ok') {
                generatedOtp = data.otpp.toString(); // Save OTP sent by server
                showToast("OTP sent to your email!", "success");

                // Hide Email section, Show OTP section
                document.getElementById('email-section').classList.add('hidden');
                document.getElementById('otp-section').classList.remove('hidden');
                document.getElementById('form-subtitle').innerText = "We've sent a 6-digit code to your email.";
            } else {
                showToast("Email not found in our records.", "error");
            }
        } catch (error) {
            showToast("Server error. Try again.", "error");
        } finally {
            btn.innerText = "Send OTP";
            btn.disabled = false;
        }
    }

    // Function 2: Verify OTP and Redirect
    function verifyOtp() {
        const enteredOtp = document.getElementById('otp_input').value.trim();

        if (!enteredOtp) {
            showToast("Please enter the OTP!", "error");
            return;
        }

        if (enteredOtp === generatedOtp) {
            showToast("OTP Verified! Redirecting...", "success");

            // Populate the hidden form and submit it to Django
            // This will trigger your `forget_password_post` logic
            document.getElementById('final_username').value = document.getElementById('email_input').value;

            setTimeout(() => {
                document.getElementById('final-submit-form').submit();
            }, 1000);
        } else {
            showToast("Invalid OTP. Try again.", "error");
        }
    }
  </script>

</body>
</html>
