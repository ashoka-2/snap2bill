
{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>

  <script src="{% static 'scripts/setting.js' %}"></script>
  <link rel="stylesheet" type="text/css" href="{% static 'admin/adminstyle.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'admin/auth.css' %}">


</head>
<body>

  <div class="glass-card">
    <h1>Change Password</h1>
    <p class="subtitle">Securely update your access credentials.</p>

    <form id="passwordForm" action="/forget_password_set_post" method="post" novalidate class="form-container">
      {% csrf_token %}

      <div class="input-group">
        <label for="newpassword" class="input-label">New Password</label>
        <input type="password" id="newpassword" name="newpassword" placeholder="Enter new password" />
        <button type="button" class="toggle-visibility" onclick="togglePassword('newpassword', this)">
          Show
        </button>
      </div>

      <div class="input-group">
        <label for="confirmpassword" class="input-label">Confirm New Password</label>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm new password" />
        <button type="button" class="toggle-visibility" onclick="togglePassword('confirmpassword', this)">
          Show
        </button>
      </div>

      <button type="submit" class="btn-primary">Update Password</button>

      <div class="form-footer">
        <a href="/" class="back-link">Back to Login</a>
      </div>
    </form>
  </div>

  <div id="snackbar"></div>

  <script>
    // 1. Toggle Visibility (Updated to match text style "Show/Hide")
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isVisible = input.type === 'text';

      input.type = isVisible ? 'password' : 'text';
      btn.innerText = isVisible ? 'Show' : 'Hide';
    }

    // 2. Show Toast Function
    function showToast(message) {
      const x = document.getElementById("snackbar");
      x.innerHTML = "<span>⚠️</span> " + message;
      x.className = "show";
      setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    // 3. Client-Side Validation
    const form = document.getElementById('passwordForm');
    const newPass = document.getElementById('newpassword');
    const confirmPass = document.getElementById('confirmpassword');

    form.addEventListener('submit', function(e) {
        const complexityPattern = /(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}/;

        if(!newPass.value || !confirmPass.value) {
            e.preventDefault();
            showToast("Please fill in both password fields.");
            return;
        }
        if (!complexityPattern.test(newPass.value)) {
            e.preventDefault();
            showToast("Password must have 1 Number, 1 Upper, 1 Lower & 8+ Chars");
            return;
        }
        if (newPass.value !== confirmPass.value) {
            e.preventDefault();
            showToast("Passwords do not match!");
            return;
        }
    });

  </script>

  {% if messages %}
    {% for message in messages %}
      <script>
        document.addEventListener("DOMContentLoaded", function() {
            showToast("{{ message }}");
        });
      </script>
    {% endfor %}
  {% endif %}

</body>
</html>
