{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Category | Snap2Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{% static 'admin/adminstyle.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'admin/category.css' %}">
    <script defer src="{% static 'scripts/setting.js' %}"></script>
    <script defer src="{% static 'scripts/navbar.js' %}"></script>
</head>
<body>
<div class="main-content">
  <div class="admin-left-main-content"></div>

  <div class="admin-right-main-content">
    
    <div class="fb-header">
      <div>
        <h1 class="fb-title">Add Category</h1>
        <p class="add-sub">Create a new collection for your inventory.</p>
      </div>
      <div class="fb-actions">
        <a href="/admin_category" class="btn btn-ghost"><i class="ri-arrow-left-line"></i> Back</a>
      </div>
    </div>

    <div class="form-card">
      <form action="/add_category_post" method="post">
        {% csrf_token %}
        
        <div class="form-group-custom">
          <label for="category">Category Name</label>
          <input type="text" name="Category" id="category" class="form-input-custom" 
                 placeholder="e.g. Electronic Appliances" required minlength="2">
          <div class="form-help-text">
            <i class="ri-information-line"></i> Short and descriptive names work best.
          </div>
        </div>

        <div class="form-actions-bar">
          <a href="/admin_category" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <i class="ri-add-circle-line"></i> Create Category
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
</body>
</html>
