{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>

  <script src="{% static 'scripts/setting.js' %}"></script>
  <link rel="stylesheet" type="text/css" href="{% static 'admin/adminstyle.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'admin/auth.css' %}">


</head>
<body>

  <div class="glass-card">
    <h1>Change Password</h1>
    <p class="subtitle">Update your account security settings.</p>

    <form id="passwordForm" action="/change_password_post" method="post" novalidate class="form-container">
      {% csrf_token %}

      <div class="input-group">
        <label for="oldpassword" class="input-label">Old Password</label>
        <input type="password" id="oldpassword" name="oldpassword" placeholder="Current password" />
        <button type="button" class="toggle-visibility" onclick="togglePassword('oldpassword', this)">
          Show
        </button>
      </div>

      <div class="input-group">
        <label for="newpassword" class="input-label">New Password</label>
        <input type="password" id="newpassword" name="newpassword" placeholder="New password" />
        <button type="button" class="toggle-visibility" onclick="togglePassword('newpassword', this)">
          Show
        </button>
      </div>

      <div class="input-group">
        <label for="confirmpassword" class="input-label">Confirm New Password</label>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm new password" />
        <button type="button" class="toggle-visibility" onclick="togglePassword('confirmpassword', this)">
          Show
        </button>
      </div>

      <button type="submit" class="btn-primary">Update Password</button>

      <div class="form-footer">
        <a href="/admin_home" class="back-link">Back to Dashboard</a>
      </div>
    </form>
  </div>

  <div id="snackbar"></div>

  {% if messages %}
  <div id="toast-container">
    {% for message in messages %}
    <div class="toast {{ message.tags }}">
      {% if message.tags == 'success' %}
      <i style="color: var(--success);">✓</i>
      {% elif message.tags == 'error' %}
      <i style="color: var(--danger);">✕</i>
      {% endif %}
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <script>
    // 1. Toggle Visibility (Using "Show/Hide" text)
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isVisible = input.type === "text";
      input.type = isVisible ? "password" : "text";
      btn.innerText = isVisible ? 'Show' : 'Hide';
    }

    // 2. Show Toast Function for JS validations
    function showToast(message) {
      const x = document.getElementById("snackbar");
      x.innerHTML = "<span>⚠️</span> " + message;
      x.className = "show";
      setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    // 3. Client-Side Validation before hitting Django
    const form = document.getElementById('passwordForm');
    const oldPass = document.getElementById('oldpassword');
    const newPass = document.getElementById('newpassword');
    const confirmPass = document.getElementById('confirmpassword');

    form.addEventListener('submit', function(e) {
        const complexityPattern = /(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}/;

        // Check 1: Empty Fields
        if(!oldPass.value || !newPass.value || !confirmPass.value) {
            e.preventDefault();
            showToast("Please fill in all fields.");
            return;
        }

        // Check 2: Complexity
        if (!complexityPattern.test(newPass.value)) {
            e.preventDefault();
            showToast("New password must have 1 Number, 1 Upper, 1 Lower & 8+ Chars");
            return;
        }

        // Check 3: Match
        if (newPass.value !== confirmPass.value) {
            e.preventDefault();
            showToast("New passwords do not match!");
            return;
        }
    });
  </script>

</body>
</html>
